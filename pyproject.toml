[project]
name = "narrative-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "civilian38", email = "gyk23953@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "pydantic>=2.14.3",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
narrative-engine = "narrative_engine:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.setuptools.package-data]
narrative_engine = ["alembic.ini"]
"narrative_engine.migrations" = [
    "script.py.mako",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
